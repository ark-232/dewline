version: 2
updates:
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
      day: tuesday
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      cargo-dev:
        dependency-type: development
        update-types: [minor, patch]
      cargo-runtime:
        dependency-type: production
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
