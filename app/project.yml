name: Dewline
options:
  bundleIdPrefix: dev.arkwerx
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "7W6LLR2DK7"
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES

packages:
  MdCore:
    path: ../Packages/MdCore
  # The M0 math engine trial; the decision record keeps SwiftMath or RaTeX.
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    revision: 1d2c90827e9c3908269d810d055fb03b7da5fd53

targets:
  Dewline:
    type: application
    platform: macOS
    sources:
      - path: Dewline
        excludes:
          - Fonts
      - path: Dewline/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: MdCore
      - package: SwiftMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkwerx.dewline
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 ArkWerx LLC
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    info:
      path: Dewline/Info.plist
      properties:
        ATSApplicationFontsPath: Fonts
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            # Viewer until saving goes through the engine; then Editor.
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd]
              public.mime-type: [text/markdown]
    scheme:
      testTargets:
        - DewlineTests

  DewlineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DewlineTests
    dependencies:
      - target: Dewline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkwerx.dewline.tests
