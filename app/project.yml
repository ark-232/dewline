name: Dewline
options:
  bundleIdPrefix: dev.arkwerx
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

# Test is Debug under other bundle IDs, so the test host keeps its own defaults, Application Support and recent
# documents instead of the app's.
configs:
  Debug: debug
  Test: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # AppKit calls @objc overrides (wantsUpdateLayer, NSDocument saves) from its display cycle, and the runtime check
    # Swift 6 inserts there crashes in swift_task_isMainExecutorImpl on macOS 27.2. Isolation stays checked at compile time.
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "7W6LLR2DK7"
    # The app writes its export stylesheet here for the Quick Look preview, whose sandbox can't read the app's defaults.
    APP_GROUP: $(DEVELOPMENT_TEAM).dev.arkwerx.dewline
    # The base64 EdDSA public key from Sparkle's generate_keys (docs/release.md). While it is empty the updater
    # refuses to start, so nothing can be checked, downloaded or installed.
    SPARKLE_PUBLIC_ED_KEY: "94Y+kagskoAjGbG5ax2itxReV31KOO9cW1VTHJkG4Ws="
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES

packages:
  MdCore:
    path: ../Packages/MdCore
  # Moves only by hand, with the version and tarball SHA-256 in scripts/sparkle-tools.sh (docs/release.md).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Dewline:
    type: application
    platform: macOS
    sources:
      - path: Dewline
        excludes:
          - Fonts
          - Specimens
          - Welcome.md
          - Syntaxes.packdump
      - path: Dewline/Welcome.md
        buildPhase: resources
      - path: Dewline/Fonts
        type: folder
        buildPhase: resources
      - path: Dewline/Specimens
        type: folder
        buildPhase: resources
      - path: Dewline/Syntaxes.packdump
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: ../CHANGELOG.md
        buildPhase: resources
    dependencies:
      - package: MdCore
      - package: Sparkle
      - target: DewlinePreview
    postBuildScripts:
      - name: Embed the dewline command
        script: exec "$SRCROOT/../scripts/embed-cli.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkwerx.dewline
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 ArkWerx LLC
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Ink, not Apple blue, fills the controls AppKit draws: default buttons, checkboxes, selected segments. Signal
        # draws lines and never fills a control (Station rule 1).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: dev.arkwerx.dewline.testhost
    entitlements:
      path: Dewline/Dewline.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: Dewline/Info.plist
      properties:
        ATSApplicationFontsPath: Fonts
        DewlineAppGroup: $(APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: dev.arkwerx.dewline
            CFBundleURLSchemes: [dewline]
        NSServices:
          - NSMenuItem:
              default: Add to Dewline Inbox
            NSMessage: addToInbox
            NSPortName: Dewline
            NSSendTypes: [public.utf8-plain-text]
            NSRequiredContext: {}
        SUFeedURL: https://dewline.arkwerx.com/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: true
        SUEnableSystemProfiling: false
        SUEnableJavaScript: false
        CFBundleURLTypes:
          - CFBundleURLName: dev.arkwerx.dewline
            CFBundleURLSchemes: [dewline]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd]
              public.mime-type: [text/markdown]

  DewlinePreview:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
    dependencies:
      - package: MdCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkwerx.dewline.preview
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dewline Preview
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 ArkWerx LLC
      configs:
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: dev.arkwerx.dewline.testhost.preview
    entitlements:
      path: QuickLook/DewlinePreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: QuickLook/Info.plist
      properties:
        DewlineAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes: [net.daringfireball.markdown]
            QLSupportsSearchableItems: false

  DewlineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DewlineTests
    dependencies:
      - target: Dewline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkwerx.dewline.tests
      configs:
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: dev.arkwerx.dewline.testhost.tests

schemes:
  Dewline:
    build:
      targets:
        Dewline: all
    run:
      config: Debug
    test:
      config: Test
      targets: [DewlineTests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
