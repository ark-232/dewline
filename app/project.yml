name: Dewline
options:
  bundleIdPrefix: dev.arkwerx
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "7W6LLR2DK7"
    # The base64 EdDSA public key from Sparkle's generate_keys (docs/release.md). While it is empty the updater
    # refuses to start, so nothing can be checked, downloaded or installed.
    SPARKLE_PUBLIC_ED_KEY: ""
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES

packages:
  MdCore:
    path: ../Packages/MdCore
  # The M0 math engine trial; the decision record keeps SwiftMath or RaTeX.
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    revision: 1d2c90827e9c3908269d810d055fb03b7da5fd53
  # Moves only by hand, with the tarball SHA-256 in .github/workflows/release.yml (docs/release.md).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Dewline:
    type: application
    platform: macOS
    sources:
      - path: Dewline
        excludes:
          - Fonts
      - path: Dewline/Fonts
        type: folder
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: MdCore
      - package: SwiftMath
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkwerx.dewline
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 ArkWerx LLC
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    info:
      path: Dewline/Info.plist
      properties:
        ATSApplicationFontsPath: Fonts
        SUFeedURL: https://updates.dewline.dev/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: true
        SUEnableSystemProfiling: false
        SUEnableJavaScript: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd]
              public.mime-type: [text/markdown]
    scheme:
      testTargets:
        - DewlineTests

  DewlineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DewlineTests
    dependencies:
      - target: Dewline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.arkwerx.dewline.tests
