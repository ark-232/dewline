<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dewline og image</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/og/og.css">
</head>
<body class="og">
  <div class="og-text">
    <span class="wordmark">dew<span>line</span></span>
    <p class="og-h">A native Mac editor that shows what agents changed.</p>
    <p class="og-meta">macOS 26 · Free · Source-available</p>
  </div>
  <div class="landing">
    <div class="win">
      <div class="win-bar">
        <span class="lights"><i></i><i></i><i></i></span>
        <span class="crumbs">notes<svg viewBox="0 0 6 10"><path d="M1 1l4 4-4 4"/></svg><b>launch-plan.md</b></span>
      </div>
      <div class="dew"><span class="dew-view"></span><span class="bead bead-1"></span><span class="bead bead-2"></span></div>
      <div class="doc">
        <p class="changed"><span class="tick"></span>Testers send reports through the form <del class="ghost">by the end of the week</del> <ins class="ins">within two days of each build, so fixes ship the same week.</ins></p>
        <div class="cbar">
          <span class="cbar-who"><i class="dot"></i><b>Claude</b> changed 2 places</span>
          <span class="k keep">Keep</span>
          <span class="k">Revert</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
