<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Dewline og image</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/og/og.css">
</head>
<body class="og">
  <div class="og-text">
    <span class="wordmark"><span class="mark"></span>dewline</span>
    <p class="og-h">See every agent edit land in your open file.</p>
  </div>
  <div class="win">
    <div class="win-bar">
      <span class="lights"><i></i><i></i><i></i></span>
      <span class="crumbs">notes<svg class="chev" viewBox="0 0 6 10"><path d="M1 1l4 4-4 4"/></svg><b>launch-plan.md</b></span>
    </div>
    <div class="dew"><span class="dew-view"></span><span class="bead bead-1"></span><span class="bead bead-2"></span></div>
    <div class="doc">
      <p class="changed"><span class="tick"></span>Testers send reports <del class="ghost">by Friday</del> <ins class="ins">within two days of each build.</ins></p>
      <div class="cbar">
        <span class="cbar-who"><i class="dot"></i>Claude changed 2 places</span>
        <span class="keys"><span class="k keep">Keep</span><span class="k">Revert</span></span>
      </div>
    </div>
  </div>
</body>
</html>
