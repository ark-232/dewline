[package]
name = "dewline-core"
description = "The Dewline engine: it owns the bytes of every open file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "dewline_core"

[dependencies]
blake3 = "=1.8.7"
imara-diff = { version = "=0.2.0", default-features = false }
libc = "=0.2.191"
pulldown-cmark = { version = "=0.13.5", default-features = false }
serde_json = "=1.0.154"
unicase = "=2.10.0"
zstd = { version = "=0.14.3", default-features = false }

[dev-dependencies]
proptest = "=1.12.0"
tempfile = "=3.27.0"
