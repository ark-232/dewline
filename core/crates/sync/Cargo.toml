[package]
name = "dewline-sync"
description = "Live collaboration on one shared file: Loro over iroh."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "dewline_sync"

[dependencies]
blake3 = "=1.8.7"
chacha20poly1305 = "=0.11.0"
data-encoding = "=2.11.1"
getrandom = "=0.4.3"
iroh = { version = "=1.3.0", default-features = false, features = ["fast-apple-datapath", "tls-ring"] }
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
loro = "=1.16.2"
n0-future = "=0.3.2"
tokio = { version = "=1.53.3", features = ["net", "rt-multi-thread", "sync", "time"] }
