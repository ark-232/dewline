[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained; askama uses it only inside uniffi-bindgen, a build tool that never ships. Remove it once a uniffi bump takes basic-toml out of Cargo.lock" },
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained; syntect reads only the syntax dump the app bundles with it, a file we build. Remove it once syntect drops bincode" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; mermaid-rs-renderer and RaTeX read fonts with it directly. Remove it once both move to skrifa" },
    { id = "RUSTSEC-2026-0248", reason = "im is unmaintained; loro-internal keeps Loro's state in its persistent maps (the sync crate, record 0009). No fixed release exists. Remove when Loro drops im" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps is unmaintained; im uses it, under loro-internal. Remove with RUSTSEC-2026-0248" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks is unmaintained; im uses it, under loro-internal. Remove with RUSTSEC-2026-0248" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is unmaintained; heapless 0.7 under postcard (iroh, iroh-gossip) uses it only on targets without native atomics, never on macOS" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; a proc macro in netlink-packet-core, which iroh's netwatch builds only on Linux" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0"]
confidence-threshold = 0.9
# The allowlist is policy for future dependencies, not a list of current ones.
unused-allowed-license = "allow"
exceptions = [
    { allow = ["MPL-2.0"], crate = "uniffi" },
    { allow = ["MPL-2.0"], crate = "uniffi_bindgen" },
    { allow = ["MPL-2.0"], crate = "uniffi_core" },
    { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_meta" },
    { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
    { allow = ["MPL-2.0"], crate = "uniffi_udl" },
    { allow = ["Zlib"], crate = "slotmap" },
    { allow = ["Zlib"], crate = "foldhash" },
    { allow = ["OFL-1.1"], crate = "ratex-katex-fonts" },
    # Loro's persistent collections (record 0009), linked as a library without changes.
    { allow = ["MPL-2.0"], crate = "im" },
    { allow = ["MPL-2.0"], crate = "bitmaps" },
    { allow = ["MPL-2.0"], crate = "sized-chunks" },
    # Boost's permissive license, for Loro's hashing.
    { allow = ["BSL-1.0"], crate = "xxhash-rust" },
    # Mozilla's root certificates as data, which iroh's relay client trusts.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
    # iroh-relay's browser WebSocket client, built only for wasm32 and never for macOS.
    { allow = ["Unlicense"], crate = "ws_stream_wasm" },
    { allow = ["Unlicense"], crate = "async_io_stream" },
    { allow = ["Unlicense"], crate = "pharos" },
]

# The crate says MIT, but the KaTeX fonts it embeds are under the SIL Open Font License.
[[licenses.clarify]]
crate = "ratex-katex-fonts"
expression = "MIT AND OFL-1.1"
license-files = [{ path = "fonts/OFL.txt", hash = 0x55ee1b8a }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
