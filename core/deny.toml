[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained; askama uses it only inside uniffi-bindgen, a build tool that never ships. Remove it once a uniffi bump takes basic-toml out of Cargo.lock" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; mermaid-rs-renderer and RaTeX read fonts with it directly. Remove it once both move to skrifa" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0"]
confidence-threshold = 0.9
# The allowlist is policy for future dependencies, not a list of current ones.
unused-allowed-license = "allow"
exceptions = [
    { allow = ["MPL-2.0"], crate = "uniffi" },
    { allow = ["MPL-2.0"], crate = "uniffi_bindgen" },
    { allow = ["MPL-2.0"], crate = "uniffi_core" },
    { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_meta" },
    { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
    { allow = ["MPL-2.0"], crate = "uniffi_udl" },
    { allow = ["Zlib"], crate = "slotmap" },
    { allow = ["OFL-1.1"], crate = "ratex-katex-fonts" },
]

# The crate says MIT, but the KaTeX fonts it embeds are under the SIL Open Font License.
[[licenses.clarify]]
crate = "ratex-katex-fonts"
expression = "MIT AND OFL-1.1"
license-files = [{ path = "fonts/OFL.txt", hash = 0x55ee1b8a }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
